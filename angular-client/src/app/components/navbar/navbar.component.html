<nav class="navbar">
  <div class="navbar-container">
    <a class="navbar-brand" routerLink="/">
      <span class="logo">MoveEase</span>
    </a>
    
    <!-- Desktop Navigation -->
    <div class="desktop-nav">
      <ng-container *ngIf="currentUser; else loggedOut">
        <!-- Logged in links -->
        <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
        
        <!-- Customer-specific links -->
        <ng-container *ngIf="currentUser.role === UserRole.CUSTOMER">
          <a class="nav-link" routerLink="/booking" routerLinkActive="active">Book a Move</a>
          <a class="nav-link" routerLink="/customer-dashboard" routerLinkActive="active">My Bookings</a>
        </ng-container>
        
        <!-- Mover-specific links -->
        <ng-container *ngIf="currentUser.role === UserRole.MOVER">
          <a class="nav-link" routerLink="/mover-dashboard" routerLinkActive="active">Available Jobs</a>
          <a class="nav-link" routerLink="/my-jobs" routerLinkActive="active">My Jobs</a>
        </ng-container>
        
        <!-- Admin-specific links -->
        <ng-container *ngIf="currentUser.role === UserRole.ADMIN">
          <a class="nav-link" routerLink="/admin-dashboard" routerLinkActive="active">Admin Dashboard</a>
        </ng-container>
        
        <div class="user-menu">
          <span class="user-greeting">Hello, {{currentUser.fullName}}</span>
          <button class="logout-btn" (click)="logout()">Logout</button>
        </div>
      </ng-container>
      
      <!-- Logged out template -->
      <ng-template #loggedOut>
        <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
        <a class="nav-link" routerLink="/about" routerLinkActive="active">About</a>
        <a class="nav-link" routerLink="/services" routerLinkActive="active">Services</a>
        <a class="auth-btn login" routerLink="/auth">Login</a>
        <a class="auth-btn register" routerLink="/auth">Register</a>
      </ng-template>
    </div>
    
    <!-- Mobile menu toggle -->
    <div class="mobile-menu-toggle" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
  
  <!-- Mobile Navigation Menu -->
  <div class="mobile-nav" [class.open]="isMenuOpen">
    <ng-container *ngIf="currentUser; else mobileLoggedOut">
      <!-- Logged in links -->
      <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="isMenuOpen = false">Home</a>
      
      <!-- Customer-specific links -->
      <ng-container *ngIf="currentUser.role === UserRole.CUSTOMER">
        <a class="nav-link" routerLink="/booking" routerLinkActive="active" (click)="isMenuOpen = false">Book a Move</a>
        <a class="nav-link" routerLink="/customer-dashboard" routerLinkActive="active" (click)="isMenuOpen = false">My Bookings</a>
      </ng-container>
      
      <!-- Mover-specific links -->
      <ng-container *ngIf="currentUser.role === UserRole.MOVER">
        <a class="nav-link" routerLink="/mover-dashboard" routerLinkActive="active" (click)="isMenuOpen = false">Available Jobs</a>
        <a class="nav-link" routerLink="/my-jobs" routerLinkActive="active" (click)="isMenuOpen = false">My Jobs</a>
      </ng-container>
      
      <!-- Admin-specific links -->
      <ng-container *ngIf="currentUser.role === UserRole.ADMIN">
        <a class="nav-link" routerLink="/admin-dashboard" routerLinkActive="active" (click)="isMenuOpen = false">Admin Dashboard</a>
      </ng-container>
      
      <div class="user-info">
        <span class="user-greeting">Hello, {{currentUser.fullName}}</span>
        <button class="logout-btn" (click)="logout(); isMenuOpen = false">Logout</button>
      </div>
    </ng-container>
    
    <!-- Logged out template for mobile -->
    <ng-template #mobileLoggedOut>
      <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="isMenuOpen = false">Home</a>
      <a class="nav-link" routerLink="/about" routerLinkActive="active" (click)="isMenuOpen = false">About</a>
      <a class="nav-link" routerLink="/services" routerLinkActive="active" (click)="isMenuOpen = false">Services</a>
      <a class="auth-btn login" routerLink="/auth" (click)="isMenuOpen = false">Login</a>
      <a class="auth-btn register" routerLink="/auth" (click)="isMenuOpen = false">Register</a>
    </ng-template>
  </div>
</nav>
